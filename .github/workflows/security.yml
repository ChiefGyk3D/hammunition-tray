# Secret scan, CodeQL (Python and the workflows themselves) and OpenSSF
# Scorecard. The jobs live in ChiefGyk3D/git-your-ship-together. No Doppler:
# nothing here needs a secret, so no identity is configured. No dependency
# audit: the helper's one runtime dependency is the archive's PyYAML.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@cc7fa6f48a612183ecd900ed15810da61b30288a # v1.17.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-queries: security-extended,security-and-quality
      pip-audit-requirements: ""
      semgrep: false
      scorecard: true
      egress-policy: block
