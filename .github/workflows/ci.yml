# CI for the Hammunition Devices applet.
#
# Three jobs, each of which can actually fail. There is deliberately no
# qmllint job: the qmllint on the development machine is a Qt5 shim that
# cannot exec and *exits 0 while failing*, so a job running it would pass
# forever without checking anything. A check nobody can trust is worse than
# no check. If a Qt6 qmllint is ever available on the runner and verified
# to go red on a broken file, add it then.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: applet package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # node runs the applet's timelogic.js against the Qt tray's
      # timelogic.py (tests/test_time_parity.py). The runner image ships
      # node; requiring it turns a missing one into a failure, not a skip.
      - name: Static checks on the package, and the Time parity test
        env:
          HAMMUNITION_REQUIRE_NODE: "1"
        run: node --version && python -m unittest discover -s tests -v

  # The Qt tray against the archive's own PyQt6 and the system python3,
  # which is what the .deb depends on. HAMMUNITION_REQUIRE_PYQT6 turns the
  # smoke test's skip into a failure here, so a broken import cannot pass
  # as "skipped" in the one job that exists to run it.
  qt:
    name: Qt tray (system python3, archive PyQt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PyQt6 and desktop-file-utils from the archive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pyqt6 desktop-file-utils
      - name: Every test, PyQt6 required
        env:
          HAMMUNITION_REQUIRE_PYQT6: "1"
          HAMMUNITION_REQUIRE_NODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -m unittest discover -s tests -v

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint the installers and the package build
        run: shellcheck install.sh uninstall.sh packaging/debian/build.sh
