# CI for the Hammunition Devices applet, the Qt tray and the device helper.
#
# The jobs live in ChiefGyk3D/git-your-ship-together (GYST); its `CI green`
# job is the check branch protection watches, once per call:
# `ci / CI green` (Python) and `shell / CI green` (shell). The one job
# kept here, `qt`, is the Qt tray against the archive's own PyQt6 and the
# system python3, which is what the .deb depends on. GYST's `distros` input
# runs the tests inside a fresh virtual environment, which cannot see the
# archive's PyQt6, and the tray's own tests start the system python3, so
# that job cannot be expressed there (tried in an ubuntu:24.04 container:
# 105 failures, all "No module named PyQt6").
#
# There is deliberately no qmllint job: the qmllint on the development
# machine is a Qt5 shim that cannot exec and *exits 0 while failing*, so a
# job running it would pass forever without checking anything. If a Qt6
# qmllint is ever available on the runner and verified to go red on a broken
# file, add it then.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, mypy --strict over the helper, and every test on the oldest Python
  # the helper supports and the newest, from a pip install of the package (so
  # the console script is real). The engine is not installed: the helper must
  # work without it, which its tests assert. node runs the applet's
  # timelogic.js against the Qt tray's timelogic.py; HAMMUNITION_REQUIRE_NODE
  # turns a missing node into a failure, not a skip. The Qt tests skip here
  # (no PyQt6 in these environments) and run in `qt` below.
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@9708d9d43bf0c27b8269c2387edc70c1efb22514 # v1.9.0
    permissions:
      contents: read
      id-token: write   # only to satisfy the called workflow's declared permissions; no Doppler here
    with:
      python-versions: '["3.11", "3.13"]'
      install-command: |
        python -m pip install --upgrade pip
        python -m pip install ./devctl pytest PyYAML
      test-command: |
        test "$(hammunition-devctl --version)" = "hammunition-devctl contract 1"
        node --version
        HAMMUNITION_REQUIRE_NODE=1 python -m pytest tests -v
      lint-install-command: pip install ruff==0.16.5
      lint-command: ruff check --isolated --select E4,E7,E9,F devctl qt tests scripts
      typecheck-install-command: pip install ./devctl mypy types-PyYAML
      typecheck-command: |
        mypy --strict --python-version 3.11 devctl/hammunition_devctl
        mypy --strict --python-version 3.13 devctl/hammunition_devctl
      docker-build: false
      egress-policy: block

  shell:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@9708d9d43bf0c27b8269c2387edc70c1efb22514 # v1.9.0
    permissions:
      contents: read
    with:
      # The installers, the package build, the Parrot install check and the
      # helper's maintainer scripts are found by shebang, not listed.
      shellcheck-severity: style   # what the old job ran: shellcheck's default
      shfmt: false   # these scripts are hand-formatted; adopting shfmt is its own change
      workflow-lint: false   # python-ci already lints the workflow files
      egress-policy: block

  qt:
    name: Qt tray (system python3, archive PyQt6)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyQt6 and desktop-file-utils from the archive
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pyqt6 desktop-file-utils python3-yaml python3-pytest
      # HAMMUNITION_REQUIRE_PYQT6 turns the smoke test's skip into a failure,
      # so a broken import cannot pass as "skipped" in the job that exists to
      # run it.
      - name: Every test, PyQt6 required
        env:
          HAMMUNITION_REQUIRE_PYQT6: "1"
          HAMMUNITION_REQUIRE_NODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 -m pytest tests -v
