# Cut a release when a v* tag is pushed. The build, the signing, the
# provenance, SHA256SUMS and the GitHub release are
# ChiefGyk3D/git-your-ship-together's artifact-release.yml; what is specific
# to this repository is the three commands below.
#
#   build-command   the tag, metadata.json and the changelog must agree, the
#                   tests pass, and both .debs plus the helper's are built
#   verify-command  exactly three .debs came out, and each installs on Parrot,
#                   has its files in place and removes cleanly
#                   (scripts/parrot-install-check.sh; a Parrot mirror outage is
#                   retried, then reported and tolerated)
#   release notes   the changelog section for the tag
#
# A pull request builds and verifies and never publishes, and so does a
# manual run: the only other way to exercise this file is to push a real tag.
# The tag reaches shell only as $VERSION through the called workflow's env.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/**
      - plasmoid/**
      - qt/**
      - devctl/**
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/artifact-release.yml@804400181a9d3e2f78dfcda5161e2bd960bc011a # v1.15.0
    permissions:
      contents: write      # the GitHub release and its assets
      id-token: write      # keyless signing and build provenance
      attestations: write  # the provenance record
    with:
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
      tag-prefix: v
      release-title: hammunition-tray ${{ github.ref_name }}
      build-install-command: python3 -m pip install pytest PyYAML
      build-command: |
        case "$VERSION" in
          # Off a tag the version is 0.0.0+<sha>: check the changelog against the tree's own.
          0.0.0+*) python3 scripts/check_version.py "v$(python3 -c 'import json; print(json.load(open("plasmoid/package/metadata.json"))["KPlugin"]["Version"])')" ;;
          *) python3 scripts/check_version.py "v$VERSION" ;;
        esac
        python3 -m pytest tests -v
        ./packaging/debian/build.sh dist
      artifacts: dist/*.deb
      verify-command: |
        test -f dist/hammunition-tray_*_all.deb
        test -f dist/hammunition-tray-qt_*_all.deb
        test -f dist/hammunition-devctl_*_all.deb
        test "$(ls dist/*.deb | wc -l)" -eq 3
        ./scripts/parrot-install-check.sh dist
      # The changelog section for this version, up to the next heading.
      release-notes-command: |
        notes="$(awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
        case "$VERSION" in 0.0.0+*) ;; *) test -n "$notes" ;; esac
        printf '%s\n' "$notes"
      # audit, not block: the build pulls docker.io/parrotsec/core and then
      # Parrot's mirror, which redirects to hosts nobody has measured. The
      # list below is what is known; the first dry run's log is the
      # measurement, and block follows it.
      egress-policy: audit
      extra-allowed-endpoints: registry-1.docker.io:443 auth.docker.io:443 production.cloudflare.docker.com:443 deb.parrot.sh:443 mirror.parrot.sh:443 deb.debian.org:80 deb.debian.org:443 pypi.org:443 files.pythonhosted.org:443
