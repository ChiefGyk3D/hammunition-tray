# Cut a release when a v* tag is pushed. The first job refuses a tag that
# disagrees with the tree; the second builds both .debs (the Plasma applet
# and hammunition-tray-qt) and checks each install on Parrot before anything
# is published; mirror fetch failures are retried and reported. The third
# publishes both with SHA256SUMS. Actions are pinned by commit (resolved with git ls-remote on
# 2026-09-27), and the tag reaches shell only through env, never through
# ${{ }} inside run: a tag is an attacker-shaped string in general.
name: release

on:
  push:
    tags: ["v*"]
  # A dry run: verify and build, check installation on Parrot, publish nothing. The only
  # other way to exercise this file is to push a real tag and delete it if
  # the first run fails.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: the tag agrees with the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag, metadata.json and the changelog agree
        env:
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) python3 scripts/check_version.py "$TAG" ;;
            # A dry run has no tag; check the changelog against the tree's own version.
            *) python3 scripts/check_version.py "v$(python3 -c 'import json; print(json.load(open("plasmoid/package/metadata.json"))["KPlugin"]["Version"])')" ;;
          esac

  build:
    name: build, and install on Parrot
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install pytest PyYAML
      - run: python3 -m pytest tests -v
      - run: ./packaging/debian/build.sh dist
      - name: installs on Parrot, files in place, removes cleanly
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker run --rm \
              -e DEBIAN_FRONTEND=noninteractive \
              -e PARROT_MIRROR_ATTEMPT="$attempt" \
              -v "$PWD/dist:/dist:ro" \
              docker.io/parrotsec/core:latest bash -c '
            set -euxo pipefail
            if [ "$PARROT_MIRROR_ATTEMPT" -ge 2 ]; then
              # Official Parrot mirror list: https://parrotsec.org/docs/mirror-list
              find /etc/apt -type f \( -name "*.list" -o -name "*.sources" \) \
                -exec sed -i -E "s@https?://[^/[:space:]]*parrot[^/[:space:]]*@https://mirror.parrot.sh/direct@g" {} +
              grep -Rqs "https://mirror.parrot.sh/direct/parrot" /etc/apt
            fi
            apt_fetch() {
              local log status
              log="$(mktemp)"
              if "$@" 2>&1 | tee "$log"; then
                rm -f "$log"
                return 0
              else
                status=$?
              fi
              if grep -Eiq "Failed to fetch|Could not resolve|Could not connect|Connection failed|Network is unreachable|Temporary failure resolving|Connection timed out|TLS connection was non-properly terminated" "$log"; then
                rm -f "$log"
                exit 75
              fi
              rm -f "$log"
              return "$status"
            }
            apt_fetch apt-get update -qq -o APT::Update::Error-Mode=any
            apt_fetch apt-get install -y -qq /dist/hammunition-tray_*_all.deb
            d=/usr/share/plasma/plasmoids/com.chiefgyk3d.hammunition.devices
            test -f "$d/metadata.json"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$d/metadata.json"
            test -f /usr/share/icons/hicolor/scalable/apps/hammunition-devices.svg
            apt-get remove -y -qq hammunition-tray
            test ! -e "$d"
            apt_fetch apt-get install -y -qq /dist/hammunition-tray-qt_*_all.deb
            test -x /usr/bin/hammunition-tray-qt
            test -f /usr/share/icons/hicolor/scalable/apps/hammunition-tray-qt-awake.svg
            grep -qx "NotShowIn=KDE;" /etc/xdg/autostart/hammunition-tray-qt.desktop
            # No tray in a container: one line on stderr and exit 0, which
            # also proves the launcher imports the installed module.
            out="$(QT_QPA_PLATFORM=offscreen timeout 60 hammunition-tray-qt 2>&1)"
            echo "$out" | grep -q "no system tray"
            apt-get remove -y -qq hammunition-tray-qt
            test ! -e /usr/bin/hammunition-tray-qt
            test ! -e /usr/share/hammunition-tray-qt
            # The helper: its files, the wrapper its postinst writes, the
            # contract number it answers through that wrapper, and a clean removal.
            apt_fetch apt-get install -y -qq /dist/hammunition-devctl_*_all.deb
            test -f /usr/share/polkit-1/actions/com.chiefgyk3d.hammunition.devctl.policy
            test "$(/usr/local/libexec/hammunition-devctl --version)" = "hammunition-devctl contract 1"
            /usr/local/libexec/hammunition-devctl services state | grep -qF "\"kind\": \"services\""
            apt-get remove -y -qq hammunition-devctl
            test ! -e /usr/local/libexec/hammunition-devctl
            test ! -e /usr/share/hammunition-devctl
            apt-get purge -y -qq hammunition-tray-qt
            test ! -e /etc/xdg/autostart/hammunition-tray-qt.desktop
              '; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -ne 75 ]; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              {
                echo "### Parrot install check failed"
                echo "Parrot install check was skipped due to the mirror after 3 attempts."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              sleep 10
            else
              sleep 30
            fi
          done
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          test -f hammunition-tray_*_all.deb
          test -f hammunition-tray-qt_*_all.deb
          test -f hammunition-devctl_*_all.deb
          test "$(ls ./*.deb | wc -l)" -eq 3
          sha256sum ./* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Checked out only for CHANGELOG.md, the release notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The changelog section for this version, up to the next heading.
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" dist/* --repo "$REPO" \
            --title "hammunition-tray $TAG" --notes-file notes.md
